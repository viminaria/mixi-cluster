apiVersion: batch/v1
kind: CronJob
metadata:
  name: fstrim
  namespace: fstrim
spec:
  schedule: "0 4 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: fstrim
              image: ubuntu:24.04
              imagePullPolicy: IfNotPresent
              command:
                - fstrim
                - -v
                - /var
              securityContext:
                privileged: true
                runAsUser: 0
              volumeMounts:
                - name: host-var
                  mountPath: /var
                  readOnly: false
          volumes:
            - name: host-var
              hostPath:
                path: /var
                type: Directory