---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: valheim
  namespace: valheim
spec:
  interval: 15m
  chart:
    spec:
      chart: valheim
      version: 14.9.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      stopAll: false
    service:
      valheim:
        enabled: true
        loadbalancerIP: ${VALHEIM_IP}
        integrations:
          metallb:
            enabled: true
    persistence:
      config:
        enabled: true
        type: nfs
        path: ${VALHEIM_CONFIG_PATH}
        server: ${PROXMOX_IP}
      backups:
        enabled: true
        type: nfs
        path: ${VALHEIM_BACKUPS_PATH}
        server: ${PROXMOX_IP}
