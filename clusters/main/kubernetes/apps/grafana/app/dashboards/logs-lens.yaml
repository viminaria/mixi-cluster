---
apiVersion: v1
kind: ConfigMap
metadata:
  name: log-lens
  namespace: grafana
  labels:
    grafana_dashboard: "1"
data:
  log-lens.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 0,
      "links": [],
      "panels": [
        {
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "lines",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never"
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 2,
          "options": {
            "legend": {
              "calcs": [
                "sum"
              ],
              "displayMode": "table",
              "placement": "right",
              "showLegend": true,
              "sortBy": "Total",
              "sortDesc": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "editorMode": "code",
              "expr": "sum by (pod) (count_over_time({namespace=~\"$namespace\"}[$__interval]))",
              "legendFormat": "{{pod}}",
              "queryType": "range",
              "refId": "A"
            }
          ],
          "title": "Log volume by pod (logs/min)",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "h": 26,
            "w": 24,
            "x": 0,
            "y": 10
          },
          "id": 1,
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": false,
            "showCommonLabels": false,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "editorMode": "code",
              "expr": "{namespace=~\"$namespace\", pod=~\"$pod\"}",
              "queryType": "range",
              "refId": "A"
            }
          ],
          "title": "Pod Logs",
          "type": "logs"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": [
        "logs",
        "kubernetes"
      ],
      "templating": {
        "list": [
          {
            "current": {},
            "datasource": {
              "type": "loki",
              "uid": "loki"
            },
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "name": "namespace",
            "query": "label_values(namespace)",
            "refresh": 2,
            "sort": 1,
            "type": "query"
          },
          {
            "current": {},
            "datasource": {
              "type": "loki",
              "uid": "loki"
            },
            "definition": "label_values({namespace=~\"$namespace\"}, pod)",
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "name": "pod",
            "query": {
              "label": "pod",
              "stream": "{namespace=~\"$namespace\"}",
              "type": 1
            },
            "refresh": 2,
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "",
      "title": "Pod Logs",
      "uid": "log-lens"
    }
