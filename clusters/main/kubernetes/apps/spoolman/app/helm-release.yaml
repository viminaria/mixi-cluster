apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spoolman
  namespace: spoolman
spec:
  interval: 5m
  chart:
    spec:
      # renovate: registryUrl=https://charts.truechartsoci.org
      chart: spoolman
      version: 3.1.4
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 5m
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    global:
      stopAll: false
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                SPOOLMAN_DIR_DATA: "{{ .Values.persistence.data.path }}"
                SPOOLMAN_DIR_LOGS: "{{ .Values.persistence.logs.path }}"
    ingress:
      main:
        enabled: true
        ingressClassName: internal
        hosts:
          - host: spoolman.${DOMAIN_0}
        integrations:
          traefik:
            enabled: false
          #auth
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
    persistence:
      data:
        type: nfs
        path: ${SPOOLMAN_DATA_PATH}
        server: ${PROXMOX_IP}
      logs:
        type: nfs
        path: ${SPOOLMAN_LOGS_PATH}
        server: ${PROXMOX_IP}
